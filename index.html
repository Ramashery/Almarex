<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Не оплачено!!!</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
  }

  body {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 100svh;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Базовый фон */
  .background {
    position: fixed;
    inset: 0;
    background: #111;
  }

  /* Белый шум / плёночная зернистость */
  .noise {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    pointer-events: none;
    opacity: 0.16;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
    animation: noise 0.18s steps(2) infinite;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 6vw;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: clamp(3.5rem, 14vw, 13rem);
    line-height: 0.88;
    letter-spacing: -0.065em;
    font-weight: 800;
    text-wrap: balance;
  }

  @keyframes noise {
    0%   { transform: translate3d(0, 0, 0); }
    20%  { transform: translate3d(-2%, 1%, 0); }
    40%  { transform: translate3d(1%, -2%, 0); }
    60%  { transform: translate3d(2%, 2%, 0); }
    80%  { transform: translate3d(-1%, -1%, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }

  @media (max-width: 600px) {
    .content {
      padding: 8vw;
    }

    h1 {
      font-size: clamp(4rem, 19vw, 8rem);
      line-height: 0.9;
      letter-spacing: -0.07em;
    }

    .noise {
      opacity: 0.19;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .noise {
      animation: none;
    }
  }
</style>
</head>
<body>
  <div class="background"></div>
  <div class="noise"></div>

  <main class="content">
    <h1>Не оплачено!!!</h1>
  </main>
</body>
</html>
